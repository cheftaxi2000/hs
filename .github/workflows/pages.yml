name: GitHub Pages

# Baut die Mechanik-Tafeln (web/, React/Vite) und veröffentlicht sie zusammen mit der
# Lernstoff-Seite: /hs/ = index.html + assets/ + PDFs, /hs/mechanik/ und /hs/analysis/ = Tafeln, /hs/errors/ = Meldungen.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Tafeln bauen und testen
        working-directory: web
        run: |
          npm ci
          npm run check
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r assets errors _site/
          for d in mechanik1 analysis1 linalg1 informatics1 chemistry1; do
            mkdir -p "_site/$d" && cp "$d"/*.pdf "_site/$d/"
          done
          cp -r web/dist _site/mechanik
          mkdir -p _site/analysis && cp web/dist/index.html _site/analysis/   # same app, opens on Analysis
      - name: Dateien versionieren (Browser lädt nach jedem Deployment neu)
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s#((href|src)=\"(\.\./)?assets/[^\"]+\.(css|js))\"#\1?v=$V\"#g" _site/index.html _site/errors/index.html
          find _site/assets/js -name '*.js' -exec sed -i -E "s#((from|import\() *'\.{1,2}/[^']+\.js)'#\1?v=$V'#g" {} +
          grep -c "?v=$V" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
