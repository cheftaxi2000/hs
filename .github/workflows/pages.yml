name: GitHub Pages

# Veröffentlicht die Lernstoff-Seite: /hs/ = index.html + assets/ + die fünf PDFs, /hs/errors/ = Meldungen.
# (Die interaktiven Animationen liegen im Branch «animationen» und werden nicht veröffentlicht.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r assets errors _site/
          for d in mechanik1 analysis1 linalg1 informatics1 chemistry1; do
            mkdir -p "_site/$d" && cp "$d"/*.pdf "_site/$d/"
          done
      - name: Dateien versionieren (Browser lädt nach jedem Deployment neu)
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s#((href|src)=\"(\.\./)?assets/[^\"]+\.(css|js))\"#\1?v=$V\"#g" _site/index.html _site/errors/index.html
          find _site/assets/js -name '*.js' -exec sed -i -E "s#((from|import\() *'\.{1,2}/[^']+\.js)'#\1?v=$V'#g" {} +
          grep -c "?v=$V" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
